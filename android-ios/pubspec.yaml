name: eventneo
description: Neo — peer-to-peer event equipment rental for Rwanda (chairs, tables, tents, sound, power).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.3

  # Networking
  dio: ^5.7.0
  pretty_dio_logger: ^1.3.1

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Real-time
  socket_io_client: ^2.0.3+1

  # UI
  cached_network_image: ^3.4.1
  go_router: ^14.6.2
  image_picker: ^1.1.2
  table_calendar: ^3.1.2
  flutter_rating_bar: ^4.0.1
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.9
  carousel_slider: ^4.2.1
  flutter_slidable: ^3.0.1

  # Utilities
  intl: ^0.20.3
  permission_handler: ^11.2.0
  characters: ^1.3.0

  # Code generation
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/satoshi/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/satoshi/Satoshi-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/satoshi/Satoshi-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/satoshi/Satoshi-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/satoshi/Satoshi-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/satoshi/Satoshi-Black.otf
          weight: 900
        - asset: assets/fonts/satoshi/Satoshi-BlackItalic.otf
          weight: 900
          style: italic
